[workspace]
resolver = "2"

members = [
    "crates/apexscan-packet",
    "crates/apexscan-discovery",
    "crates/apexscan-scanner",
    "crates/apexscan-timing",
    "crates/apexscan-fingerprint",
    "crates/apexscan-scripting",
    "crates/apexscan-distributed",
    "crates/apexscan-database",
    "crates/apexscan-vuln",
    "crates/apexscan-passive",
    "crates/apexscan-api",
    "crates/apexscan-cli",
    "crates/apexscan-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["ApexScan Team"]
license = "TBD"
repository = "https://github.com/yourusername/apexscan"
homepage = "https://apexscan.io"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"

# Networking
socket2 = "0.5"
pnet = "0.34"
pnet_packet = "0.34"
trust-dns-resolver = "0.23"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.4", features = ["derive", "cargo"] }
colored = "2.1"
indicatif = "0.17"

# Database
neo4rs = "0.7"
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres"] }

# Web framework
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1.0"

# Python integration
pyo3 = { version = "0.20", features = ["auto-initialize"] }

# Performance
rayon = "1.8"
crossbeam = "0.8"
parking_lot = "0.12"
dashmap = "5.5"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
regex = "1.10"
lazy_static = "1.4"
once_cell = "1.19"

# Testing
criterion = "0.5"
mockall = "0.12"
proptest = "1.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"
